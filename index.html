    <!-- Service Worker Auto-Registration script -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('SAS Service Worker loaded on range:', reg.scope);
            })
            .catch((err) => {
              console.error('SAS Service Worker registration failed:', err);
            });
        });
      }
    </script>
